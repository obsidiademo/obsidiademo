<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifremi Unuttum – Gönül Bağları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">🔑</div>
      <h2>Şifremi Unuttum</h2>
      <p>E-posta adresinize sıfırlama bağlantısı gönderilecektir</p>
    </div>
    <form data-validate data-success-msg="Sıfırlama bağlantısı e-posta adresinize gönderildi!">
      <div class="form-group">
        <label class="form-label">E-posta Adresi</label>
        <input type="email" class="form-control" placeholder="ornek@email.com" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Sıfırlama Bağlantısı Gönder</button>
    </form>
    <div class="auth-footer">
      <a href="giris.html">← Giriş sayfasına dön</a>
    </div>
  </div>
</div>
<script src="assets/js/main.js"></script>
</body></html>
