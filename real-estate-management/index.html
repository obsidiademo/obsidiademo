    <div class="main">
      <header class="header">

          <i data-lucide="search"></i>
          <span>Portföy, müşteri, telefon, ada/parsel ara...</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="header-actions">
          <button class="icon-btn" id="themeBtn" title="Tema"><i data-lucide="moon"></i></button>
          <button class="icon-btn" id="notifBtn" title="Bildirimler">
            <i data-lucide="bell"></i>
            <span class="dot" id="notifDot"></span>
          </button>
          <div class="notif-panel" id="notifPanel"></div>
          <button class="user-chip" id="userChip">
            <div class="avatar">AY</div>
            <div class="user-meta"><strong>Ahmet Yılmaz</strong><span>Emlak Danışmanı · Bakırköy</span></div>
            <i data-lucide="chevron-down" style="width:16px;height:16px"></i>
          </button>
          <div class="profile-menu" id="profileMenu">
            <button onclick="REMS.Router.go('profile')">Profil</button>
            <button onclick="REMS.Router.go('settings')">Hesabım</button>
            <button onclick="REMS.Router.go('notifications')">Bildirim Ayarları</button>
            <button onclick="REMS.Pages.toggleTheme()">Tema Değiştir</button>

            <button onclick="location.href='public/index.html'">Vitrine Git</button>

  <nav class="mobile-nav">
    <button data-route="dashboard" class="active"><i data-lucide="home"></i> Ana Sayfa</button>
    <button data-route="properties"><i data-lucide="building-2"></i> Portföy</button>
    <button data-route="leads"><i data-lucide="filter"></i> Lead</button>
    <button data-route="calendar"><i data-lucide="calendar"></i> Takvim</button>
    <button data-route="profile"><i data-lucide="user"></i> Profil</button>

  <div class="modal" id="modal"></div>

  <div class="toast-stack" id="toastStack"></div>

  <div class="cmdk" id="cmdk">
    <input type="text" id="cmdkInput" placeholder="Portföy no, müşteri, telefon, danışman, mahalle, ada, parsel...">
    <div class="cmdk-results" id="cmdkResults"></div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/locales/tr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/crm.js"></script>
  <script src="js/leads.js"></script>
  <script src="js/appointments.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/contracts.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/ai.js"></script>
  <script>
    (function boot() {
      REMS.Store.load();
      if (REMS.Store.data.theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      REMS.UI.updateUserChip();
      REMS.UI.updateNotifBadge();

      document.querySelectorAll('.nav-item, .mobile-nav button').forEach(btn => {
        btn.addEventListener('click', () => REMS.Router.go(btn.dataset.route));
      });

      document.getElementById('menuToggle').onclick = () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarBackdrop').classList.toggle('open');
      };
      document.getElementById('sidebarBackdrop').onclick = () => {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarBackdrop').classList.remove('open');
      };
      document.getElementById('overlay').onclick = () => REMS.UI.closeOverlays();

      document.getElementById('themeBtn').onclick = () => REMS.Pages.toggleTheme();

      document.getElementById('notifBtn').onclick = (e) => {
        e.stopPropagation();
        const panel = document.getElementById('notifPanel');
        const open = panel.classList.toggle('open');
        document.getElementById('profileMenu').classList.remove('open');
        if (open) {
          panel.innerHTML = `<div class="card-header"><h3>Bildirimler</h3>
            <button class="btn btn-sm btn-ghost" onclick="REMS.Pages.markAllRead()">Tümü okundu</button></div>
            <div class="notif-list">${REMS.Store.data.notifications.slice(0,12).map(n => `
              <div class="notif-item ${n.read?'':'unread'}" onclick="REMS.Pages.readNotif('${n.id}');REMS.Router.go('notifications')">
                <strong>${n.title}</strong><p>${n.body}</p>
                <div class="text-muted" style="font-size:11px">${n.at}</div>
              </div>`).join('')}</div>`;
        }
      };

      document.getElementById('userChip').onclick = (e) => {
        e.stopPropagation();
        document.getElementById('profileMenu').classList.toggle('open');
        document.getElementById('notifPanel').classList.remove('open');
      };

      document.addEventListener('click', () => {
        document.getElementById('notifPanel').classList.remove('open');
        document.getElementById('profileMenu').classList.remove('open');
      });

      const openCmdk = () => {
        const cmdk = document.getElementById('cmdk');
        cmdk.classList.add('open');
        document.getElementById('overlay').classList.add('open');
        const input = document.getElementById('cmdkInput');
        input.value = '';
        input.focus();
        renderCmdk('');
      };
      document.getElementById('searchTrigger').onclick = openCmdk;
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          openCmdk();
        }
        if (e.key === 'Escape') REMS.UI.closeOverlays();
      });
      document.getElementById('cmdkInput').oninput = (e) => renderCmdk(e.target.value);

      function renderCmdk(q) {
        q = (q || '').toLowerCase().trim();
        const d = REMS.Store.data;
        const results = [];
        d.properties.forEach(p => {
          const hay = `${p.code} ${p.title} ${p.address.mahalle} ${p.address.ilce} ${p.land?.ada||''} ${p.land?.parsel||''}`.toLowerCase();
          if (!q || hay.includes(q)) results.push({ type: 'Portföy', title: p.code, sub: p.title, action: () => REMS.Router.go('property-detail', { id: p.id }) });
        });
        d.customers.forEach(c => {
          const hay = `${c.name} ${c.phone}`.toLowerCase();
          if (!q || hay.includes(q)) results.push({ type: 'Müşteri', title: c.name, sub: c.phone, action: () => { REMS.UI.closeOverlays(); REMS.CRM.customerDetail(c.id); } });
        });
        d.owners.forEach(o => {
          const hay = `${o.name} ${o.phone}`.toLowerCase();
          if (!q || hay.includes(q)) results.push({ type: 'Mülk Sahibi', title: o.name, sub: o.phone, action: () => { REMS.UI.closeOverlays(); REMS.CRM.ownerDetail(o.id); } });
        });
        d.agents.forEach(a => {
          if (!q || a.name.toLowerCase().includes(q)) results.push({ type: 'Danışman', title: a.name, sub: a.role, action: () => REMS.Router.go('agents') });
        });
        if (!q || q.includes('ai') || q.includes('analiz') || q.includes('yapay')) {
          results.unshift({ type: 'Modül', title: 'AI Portföy Analizi', sub: 'Fiyat · talep · yaşlanma', action: () => REMS.Router.go('ai-analysis') });
        }
        if (!q || q.includes('eids') || q.includes('doğrulama') || q.includes('edevlet') || q.includes('e-devlet') || q.includes('ticaret')) {
          results.unshift({ type: 'Modül', title: 'EİDS Entegrasyon', sub: 'Elektronik İlan Doğrulama', action: () => REMS.Router.go('eids') });
        }
        const box = document.getElementById('cmdkResults');
        box.innerHTML = results.slice(0, 20).map((r, i) => `
          <button class="cmdk-item" data-i="${i}"><div><strong>${r.title}</strong><span>${r.type} · ${r.sub}</span></div></button>
        `).join('') || '<div class="cmdk-item"><strong>Sonuç yok</strong></div>';
        box.querySelectorAll('.cmdk-item').forEach((el, i) => {
          el.onclick = () => { REMS.UI.closeOverlays(); results[i]?.action(); };
        });
      }

      window.addEventListener('hashchange', () => REMS.Router.parse());
      REMS.Router.parse();
      if (window.lucide) lucide.createIcons();
    })();
  </script>
