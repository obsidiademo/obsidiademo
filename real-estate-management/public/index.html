<!DOCTYPE html>
<html lang="tr" data-theme="teal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmlakPro Vitrin — Satılık & Kiralık Gayrimenkul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#home">
        <div class="logo-mark">EP</div>
        <div>EmlakPro<span style="font-weight:500;color:var(--muted);font-size:12px;display:block;line-height:1">Vitrin</span></div>
      </a>
      <nav class="nav-links">
        <a href="#home" class="active" data-nav="home">Ana Sayfa</a>
        <a href="#sale" data-nav="sale">Satılık</a>
        <a href="#rent" data-nav="rent">Kiralık</a>
        <a href="#projects" data-nav="projects">Projeler</a>
        <a href="#agents" data-nav="agents">Danışmanlar</a>
      </nav>
      <div class="top-actions">
        <a class="admin-chip" href="../index.html">← Admin Panele Dön</a>
        <button class="btn btn-outline" id="favBtn">Favoriler (<span id="favCount">0</span>)</button>
        <button class="btn btn-primary" onclick="location.hash='sale'">İlan Ara</button>
      </div>
    </div>
    <div class="theme-bar">
      <span>Tema seç:</span>
      <button class="theme-dot active" data-t="teal" title="Teal"></button>
      <button class="theme-dot" data-t="ocean" title="Ocean"></button>
      <button class="theme-dot" data-t="forest" title="Forest"></button>
      <button class="theme-dot" data-t="sunset" title="Sunset"></button>
      <button class="theme-dot" data-t="slate" title="Slate"></button>
      <button class="theme-dot" data-t="rose" title="Rose"></button>
      <button class="theme-dot" data-t="indigo" title="Indigo"></button>
      <button class="theme-dot" data-t="amber" title="Amber"></button>
      <button class="theme-dot" data-t="mint" title="Mint"></button>
      <button class="theme-dot" data-t="night" title="Night"></button>
    </div>
  </header>

  <div id="app"></div>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <strong style="color:var(--text)">EmlakPro Gayrimenkul</strong>
        <div>Kurumsal web ilan vitrini · Admin panelle entegre demo</div>
      </div>
      <div>
        <a href="../index.html" class="btn btn-outline">Yönetim Paneline Git</a>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/data.js"></script>
  <script src="js/marketplace.js"></script>
</body>
</html>
