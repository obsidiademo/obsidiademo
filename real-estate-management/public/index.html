<!DOCTYPE html>
<html lang="tr" data-theme="teal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ObsidiaDigital EmlakPro Vitrin — Satılık & Kiralık</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#home" title="ObsidiaDigital">
        <img class="logo-light" src="../assets/images/obsidia-digital-logo.png" alt="ObsidiaDigital">
        <img class="logo-dark" src="../assets/images/obsidia-digital-logo-white.png" alt="ObsidiaDigital">
      </a>
      <nav class="nav-links">
        <a href="#home" class="active" data-nav="home">Ana Sayfa</a>
        <a href="#sale" data-nav="sale">Satılık</a>
        <a href="#rent" data-nav="rent">Kiralık</a>
        <a href="#projects" data-nav="projects">Projeler</a>
        <a href="#agents" data-nav="agents">Danışmanlar</a>
      </nav>
      <div class="top-actions">
        <a class="admin-chip" href="../login.html">Emlakçı Girişi</a>
        <a class="admin-chip" href="../index.html">← Admin Panel</a>
        <button class="btn btn-outline" id="favBtn" type="button">Favoriler (0)</button>
        <button class="btn btn-primary" type="button" onclick="location.hash='sale'">İlan Ara</button>
      </div>
    </div>
    <div class="theme-bar" aria-label="Tema seçici">
      <span>Tema</span>
      <button class="theme-dot active" data-t="teal" title="Teal"></button>
      <button class="theme-dot" data-t="ocean" title="Ocean"></button>
      <button class="theme-dot" data-t="forest" title="Forest"></button>
      <button class="theme-dot" data-t="sunset" title="Sunset"></button>
      <button class="theme-dot" data-t="slate" title="Slate"></button>
      <button class="theme-dot" data-t="rose" title="Rose"></button>
      <button class="theme-dot" data-t="indigo" title="Indigo"></button>
      <button class="theme-dot" data-t="amber" title="Amber"></button>
      <button class="theme-dot" data-t="mint" title="Mint"></button>
      <button class="theme-dot" data-t="night" title="Night"></button>
    </div>
  </header>

  <div id="app"></div>

  <footer class="footer">
    <div class="footer-inner">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <img class="site-logo" src="../assets/images/obsidia-digital-logo.png" alt="ObsidiaDigital" style="height:32px">
        <div>
          <strong style="color:var(--text)">ObsidiaDigital · EmlakPro</strong>
          <div>Kurumsal web ilan vitrini · Admin panelle entegre demo</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="../login.html" class="btn btn-outline">Emlakçı Girişi</a>
        <a href="../index.html" class="btn btn-outline">Yönetim Paneli</a>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/data.js"></script>
  <script src="js/marketplace.js"></script>
</body>
</html>
